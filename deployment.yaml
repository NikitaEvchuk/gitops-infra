apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitops-app-deployment
  labels:
    app: gitops-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gitops-app
  template:
    metadata:
      labels:
        app: gitops-app
    spec:
      containers:
      - name: gitops-app
        image: ghcr.io/nikitaevchuk/gitops-app:8944c1049a0f455a61e784d4aef41bf28c997546
        ports:
        - containerPort: 8000
